# One pinned reference AHCI endpoint. Runtime TDISP qualification is separate.
[incubator]
type = "fvp-cca"
platform = "realm-vfio"
consoles = ["host", "edk2", "rmm"]
primary-console = "host"
capabilities = ["cca", "guest_memfd_in_place", "cca_realm_vfio"]
