# Opt-in source-built host and guest candidate with the AHCI fixture.
[incubator]
type = "fvp-cca"
platform = "realm-vfio-source-built"
consoles = ["host", "edk2", "rmm"]
primary-console = "host"
capabilities = ["cca", "guest_memfd_in_place", "cca_realm_vfio"]
