# Reuse the published QEMU/TF-A/TF-RMM artifacts with the pinned local kernel.
# Diagnostic candidate: Realm boot currently stalls before pipette.
[incubator]
type = "qemu-cca"
guest-memfd-in-place = true
binary = "qemu-system-aarch64"
machine = "virt,secure=on,virtualization=on,gic-version=3,acpi=off"
cpu = "max,x-rme=on,lpa2=off,sme=off,pauth-impdef=on"
memory = "2G"
smp = "1"
kernel-load-address = 0x50080000
initrd-load-address = 0x48000000
consoles = ["host", "secure"]
primary-console = "host"
capabilities = ["cca", "guest_memfd_in_place"]
