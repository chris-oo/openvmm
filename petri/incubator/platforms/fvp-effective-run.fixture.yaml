# Expected merge of fvp-packaged-run.fixture.yaml and fvp-initrd-overlay.yaml.
run:
  rtvars:
    KERNEL: {type: path, value: '${artifact:KERNEL}'}
    DTB: {type: path, value: '${artifact:DTB}'}
    BL1: {type: path, value: '${artifact:BL1}'}
    FIP: {type: path, value: '${artifact:FIP}'}
    SHARE: {type: path, value: ''}
    CMDLINE: {type: string, value: ''}
    ROOTFS: {type: string, value: ''}
    INITRD: {type: path}
  params:
    -C bp.virtioblockdevice.image_path: ''
    -C bp.virtiop9device.root_path: ${rtvar:SHARE}
    -C bp.secureflashloader.fname: ${rtvar:BL1}
    -C bp.flashloader0.fname: ${rtvar:FIP}
    -C cluster0.cpu0.semihosting-cwd: $${SEMIHOSTDIR}
  prerun:
    - SEMIHOSTDIR=`mktemp -d`
    - function finish { rm -rf $$SEMIHOSTDIR; }
    - trap finish EXIT
    - cp ${rtvar:KERNEL} $${SEMIHOSTDIR}/Image
    - cp ${rtvar:DTB} $${SEMIHOSTDIR}/fdt.dtb
    - cat <<EOF > $${SEMIHOSTDIR}/startup.nsh
    - Image dtb=fdt.dtb ${rtvar:CMDLINE}
    - EOF
    - test -f "${rtvar:INITRD}"
    - cp "${rtvar:INITRD}" "$${SEMIHOSTDIR}/initrd"
    - >-
      printf '%s\n' 'Image dtb=fdt.dtb initrd=initrd rdinit=/cca-init.sh console=ttyAMA0 earlycon=pl011,0x1c090000 ip=off' > "$${SEMIHOSTDIR}/startup.nsh"
